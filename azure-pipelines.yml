trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  TARGET_URL: 'https://google.com'

  # Docker Variables
  dockerRegistryServiceConnection: 'docker-registry'
  imageRepository: '9893346605/devops-example'
  dockerfilePath: 'Dockerfile'

stages:

- stage: Build
  displayName: 'Build Application'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build'

    steps:
    - checkout: self

    - task: Maven@4
      displayName: 'Build Application'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package cyclonedx:makeAggregateBom'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        jdkVersionOption: '1.11'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Source Artifact'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)'
        artifact: 'source-code'
    - script: |
        pwd
        ls -la
        ls -la target/
        pwd
      displayName: 'check target folder'    

- stage: SonarScan
  displayName: 'SonarCloud Analysis'
  dependsOn: Build

  jobs:
  - job: Sonar

    steps:
    - checkout: self

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: 'sonarqube-pwc'
        organization: 'sonamsoni2415'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'sonamsoni2415_DevOps-Example'
        extraProperties: |
          sonar.sources=src/main/java
          sonar.tests=src/test/java

    - task: SonarCloudAnalyze@4

- stage: DependencyTrack
  displayName: 'Dependency Track Scan'
  dependsOn: SonarScan

  jobs:
  - job: DependencyTrackScan

    steps:
    - checkout: self

    # - task: Maven@4
    #   displayName: 'Generate CycloneDX SBOM'
    #   inputs:
    #     mavenPomFile: 'pom.xml'
    #     goals: 'cyclonedx:makeAggregateBom'
    #     jdkVersionOption: '1.11'

    # - script: |
    #     echo "Verifying SBOM..."
    #     ls -la target/
    #     pwd
    #   displayName: 'Verify BOM'

    #- task: upload-bom-dtrack@1
    #  displayName: 'Upload BOM to Dependency Track'
     # inputs:
      #  dtrackProjName: 'DevOps_example'
       # dtrackURI: '$(DTRACK_URL)'
        #bomFilePath: 'target/bom.xml'
        #dtrackAPIKey: '$(DTRACK_API_KEY1)'
    - script: |
        pwd
        ls -la
        ls -la target/
        pwd
      displayName: 'check target folder'
      
- stage: DockerBuildPush
  displayName: 'Docker Build and Push'
  dependsOn: DependencyTrack

  jobs:
  - job: DockerBuildPush

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        dockerfile: '(Build.SourcesDirectory)/Dockerfile'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(Build.BuildId)
          latest

- stage: DAST
  displayName: 'OWASP ZAP Scan'
  condition: false

  jobs:
  - job: ZAPScan

    steps:

    - script: |
        mkdir -p $(System.DefaultWorkingDirectory)/zap-reports
      displayName: 'Create Report Directory'

    - script: |
        docker run --user root \
        -v $(System.DefaultWorkingDirectory)/zap-reports:/zap/wrk:rw \
        -t zaproxy/zap-stable \
        zap-baseline.py \
        -t $(TARGET_URL) \
        -r zap_report.html \
        -x zap_report.xml
      displayName: 'Execute ZAP Baseline Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish ZAP Reports'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/zap-reports'
        ArtifactName: 'ZAP_Security_Reports'
        publishLocation: 'Container'
